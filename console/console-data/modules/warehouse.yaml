schemaVersion: 1
module:
  id: warehouse
  name: Warehouse
  version: 1.0.0
  type: business
  description: 'V06-FINAL Real MySQL Import proof (imported from ep_final_accept.warehouse)'
compatibility:
  platformVersion: 0.6
business:
  table: warehouse
  entity:
    name: Warehouse
    fields:
      - name: code
        type: string
        required: true
        unique: true
        length: 50
        comment: 'warehouse code'
        frontend:
          label: Code
          order: 0
          searchable: true
      - name: name
        type: string
        required: true
        length: 100
        comment: 'warehouse name'
        frontend:
          label: Name
          order: 1
          searchable: true
      - name: address
        type: string
        length: 200
        comment: 'warehouse address'
        frontend:
          label: Address
          order: 2
      - name: manager
        type: string
        length: 50
        comment: 'warehouse manager'
        frontend:
          label: Manager
          order: 3
      - name: status
        type: string
        required: true
        length: 20
        default: ACTIVE
        comment: 'warehouse status'
        frontend:
          label: Status
          order: 4
  features:
    - list
    - search
    - create
    - edit
    - detail
    - disable
  enterprise:
    permissions: true
    dataScope: true
    menu: true
    dictionary: true
    operationLog: true
  frontend:
    route: '/warehouse'
    label: Warehouse
