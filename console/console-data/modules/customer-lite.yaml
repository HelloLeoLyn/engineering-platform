schemaVersion: 1
module:
  id: customer-lite
  name: CustomerLite
  version: 1.0.0
  type: business
  description: 'V06-WORK-005 Manual builder proof (no dedicated capability)'
compatibility:
  platformVersion: 0.6
business:
  table: customer_lite
  entity:
    name: CustomerLite
    fields:
      - name: code
        type: string
        required: true
        unique: true
        length: 50
        comment: 'customer code'
        frontend:
          label: code
          order: 0
          listVisible: true
          searchable: true
          formVisible: true
          detailVisible: true
      - name: name
        type: string
        required: true
        length: 100
        frontend:
          label: name
          order: 1
          listVisible: true
          searchable: true
          formVisible: true
          detailVisible: true
      - name: phone
        type: string
        length: 30
        comment: 'contact phone'
        frontend:
          label: phone
          order: 2
          listVisible: true
          searchable: true
          formVisible: true
          detailVisible: true
      - name: status
        type: string
        semantic: dictionary
        dictionary: customer_status
        frontend:
          label: status
          order: 3
          listVisible: true
          formVisible: true
          detailVisible: true
      - name: level
        type: string
        semantic: dictionary
        dictionary: customer_level
        frontend:
          label: level
          order: 4
          listVisible: true
          formVisible: true
          detailVisible: true
  features:
    - list
    - search
    - create
    - edit
    - detail
    - disable
  enterprise:
    permissions: true
    dataScope: true
    menu: true
    dictionary: true
    operationLog: true
  frontend:
    route: '/customer-lite'
    label: CustomerLite
