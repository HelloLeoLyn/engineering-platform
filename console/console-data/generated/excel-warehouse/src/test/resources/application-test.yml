# TEST profile (generated by engineering-platform 0.1.0)
# H2 in-memory + schema/seed init for generated-project security E2E.
# Production profile is NOT affected: no known credentials are shipped.

spring:
  datasource:
    url: jdbc:h2:mem:rbacdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      # Wildcard loads V002__rbac.sql (+ V003/V004 when organization/data-permission enabled)
      schema-locations: classpath:db/migration/*.sql
      # Wildcard loads seed-test-data.sql (rbac) then seed-z-data-permission.sql (data-permission)
      data-locations: classpath:db/seed/*.sql

auth:
  token:
    secret: test-only-secret-key-0123456789abcdef
    expiration-seconds: 3600
