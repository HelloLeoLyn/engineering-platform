schemaVersion: 1
registry:
  type: capabilities
  version: 1
entries:
  - id: web
    description: Spring Web 基础能力（capabilities/web）
  - id: validation
    description: Jakarta Validation 基础能力（capabilities/validation）
  - id: exception-handling
    description: 统一异常响应与全局异常处理（capabilities/exception-handling）
  - id: logging
    description: 标准应用日志基线（capabilities/logging）
  - id: persistence
    description: 持久化 capability contract（capabilities/persistence）
  - id: audit
    description: 工程级审计基础能力（capabilities/audit）
  - id: platform-core
    description: 企业平台核心契约（ApiResponse/ErrorCode/PlatformException/PageQuery/PageResult/RequestContext/CurrentClock/IdGenerator）
  - id: authentication
    description: 轻量认证能力（BCrypt + HMAC Token + 认证拦截器 + 统一安全错误）
  - id: rbac
    description: RBAC 企业能力（User/Role/Permission + @RequirePermission enforcement）
  - id: organization
    description: 组织/部门基础能力（Department 树 + 用户部门关联）
  - id: data-permission
    description: 数据权限 V1（DataScope 四种范围 + 查询层 enforcement）
  - id: menu
    description: 菜单企业能力（DIRECTORY/MENU/ACTION 资源模型 + permissionCode 引用 RBAC + /api/menus/me 权限过滤）
  - id: dictionary
    description: 字典企业能力（DictionaryType + DictionaryItem + disabled 过滤 + 稳定排序 + DTO 边界）
  - id: operation-log
    description: 操作日志企业能力（@OperationLog 切面 enforcement + SUCCESS/FAILURE + 敏感数据安全 Gate）
  - id: product-reference
    description: Reference Product CRUD（V0.4 验证宿主：真实消费全部企业能力的业务模块，非通用 CRUD Generator）
  - id: frontend-shell
    description: 前端 Shell 基础能力（Vue3+TS+Vite+Router+Pinia+Element Plus+Vitest 工程配置，frontend/ additive output）
  - id: frontend-auth
    description: 前端认证与应用框架（Login + Auth Store + Request Client + Router + App Shell + 401 处理）
  - id: frontend-permission
    description: 前端权限 UI（PermissionGuard/v-permission/PermissionButton + UX 基础组件，仅可见性）
