schemaVersion: 1
registry:
  type: capabilities
  version: 1
entries:
  - id: web
    description: Spring Web 基础能力（capabilities/web）
  - id: validation
    description: Jakarta Validation 基础能力（capabilities/validation）
  - id: exception-handling
    description: 统一异常响应与全局异常处理（capabilities/exception-handling）
  - id: logging
    description: 标准应用日志基线（capabilities/logging）
  - id: persistence
    description: 持久化 capability contract（capabilities/persistence）
  - id: audit
    description: 工程级审计基础能力（capabilities/audit）
  - id: platform-core
    description: 企业平台核心契约（ApiResponse/ErrorCode/PlatformException/PageQuery/PageResult/RequestContext/CurrentClock/IdGenerator）
  - id: authentication
    description: 轻量认证能力（BCrypt + HMAC Token + 认证拦截器 + 统一安全错误）
  - id: rbac
    description: RBAC 企业能力（User/Role/Permission + @RequirePermission enforcement）
  - id: organization
    description: 组织/部门基础能力（Department 树 + 用户部门关联）
  - id: data-permission
    description: 数据权限 V1（DataScope 四种范围 + 查询层 enforcement）
