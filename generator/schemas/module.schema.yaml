# module.schema.yaml — Module Contract Schema V1（V0.6 兼容扩展 business 小节）
# 依据: Engineering Platform 设计决策记录 V0.7 第 17 节
# 描述: 模块契约，承载 Identity / Compatibility / Required·Optional
#       Module & Capability Dependencies / Provides / Resources /
#       State Machine Metadata / Configuration·Policy Definitions /
#       Quality Minimum / Migration / Extension Points / Guides / Metadata。
# V0.6 (V06-WORK-001) 兼容扩展:
#   - business 小节（可选）: Generic Business Module Contract
#     table / entity.fields / features / enterprise / frontend metadata
#     旧 module manifest 不带 business 仍通过（向后兼容）。
# 约束: 仅声明式 Contract/Metadata；禁止 Secret / 客户 Runtime Values /
#       业务数据 / 任意可执行代码。
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://engineering-platform.dev/schemas/module.schema.v1.yaml
title: Engineering Platform Module Contract
description: Module contract (V1)

type: object
additionalProperties: false
required:
  - schemaVersion
  - module
  - compatibility

properties:
  schemaVersion:
    description: Manifest schema version. Bump requires a documented migration.
    const: 1

  module:
    type: object
    additionalProperties: false
    required: [id, name, version]
    properties:
      id:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      name:
        type: string
        minLength: 1
        maxLength: 200
      version:
        type: string
        pattern: ^\d+\.\d+\.\d+$
      type:
        type: string
        enum: [business, platform, capability, provider-binding]
      description:
        type: string
        maxLength: 2000

  compatibility:
    type: object
    additionalProperties: false
    required: [platformVersion]
    properties:
      platformVersion:
        type: string
        maxLength: 50
      moduleSchema:
        type: integer
      requires:
        type: array
        uniqueItems: true
        items:
          type: string

  dependencies:
    type: object
    additionalProperties: false
    properties:
      requiredModules:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      optionalModules:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      requiredCapabilities:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9]+(\.[a-z0-9]+)*$
      optionalCapabilities:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9]+(\.[a-z0-9]+)*$

  provides:
    type: object
    additionalProperties: false
    properties:
      capabilities:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9]+(\.[a-z0-9]+)*$
      resources:
        type: array
        uniqueItems: true
        items:
          type: string
      apis:
        type: array
        uniqueItems: true
        items:
          type: string
      events:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9]+\.[a-z0-9]+\.[a-z0-9]+$

  resources:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [table, queue, bucket, cache, index, file]
        name:
          type: string
        migration:
          type: string

  stateMachine:
    type: object
    additionalProperties: false
    properties:
      states:
        type: array
        uniqueItems: true
        items:
          type: string
      initial:
        type: string
      transitions:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from:
              type: string
            to:
              type: string
            guard:
              type: string
            on:
              type: string

  configuration:
    type: object
    additionalProperties: false
    properties:
      policies:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [key]
          properties:
            key:
              type: string
              pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
            type:
              type: string
            default:
              type: [string, number, boolean, array, object]
            required:
              type: boolean
            description:
              type: string

  quality:
    type: object
    additionalProperties: false
    properties:
      minimum:
        type: string
        pattern: ^Q[1-3]$
      gates:
        type: array
        uniqueItems: true
        items:
          type: string

  migration:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [version, description]
      properties:
        version:
          type: string
        description:
          type: string
        breaking:
          type: boolean

  extensionPoints:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        ownership:
          type: string
          enum: [GENERATED, MANAGED, USER_OWNED, IMMUTABLE]
        contract:
          type: string

  guides:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [topic]
      properties:
        topic:
          type: string
        path:
          type: string

  metadata:
    type: object
    additionalProperties: true
    properties:
      ownerTeam:
        type: string
      tags:
        type: array
        items:
          type: string

  # V06-WORK-001: Generic Business Module Contract（可选）
  business:
    type: object
    additionalProperties: false
    properties:
      table:
        description: 数据库表名（单表模型；V0.6 不做主从/多对多/复杂关系）。
        type: string
        pattern: ^[a-z][a-z0-9_]*$
      entity:
        type: object
        additionalProperties: false
        required: [name, fields]
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 200
          fields:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: object
              additionalProperties: false
              required: [name, type]
              properties:
                name:
                  type: string
                  pattern: ^[a-z][a-z0-9]*$
                type:
                  type: string
                  enum: [string, number, integer, decimal, boolean, date, datetime, text]
                required:
                  type: boolean
                unique:
                  type: boolean
                length:
                  type: integer
                  minimum: 1
                precision:
                  type: integer
                  minimum: 1
                scale:
                  type: integer
                  minimum: 0
                default:
                  type: [string, number, boolean]
                primaryKey:
                  type: boolean
                comment:
                  type: string
                # Semantic mapping: dictionary / department / ownership/currentUser / system
                semantic:
                  type: string
                  enum: [none, dictionary, department, ownership, currentUser, system]
                dictionary:
                  description: semantic=dictionary 时引用的字典类型 key。
                  type: string
                frontend:
                  type: object
                  additionalProperties: false
                  properties:
                    label:
                      type: string
                    listVisible:
                      type: boolean
                    searchVisible:
                      type: boolean
                    formVisible:
                      type: boolean
                    detailVisible:
                      type: boolean
                    component:
                      type: string
                    order:
                      type: integer
      features:
        description: 支持的 CRUD 能力。
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [list, search, create, edit, detail, enable, disable]
      enterprise:
        type: object
        additionalProperties: false
        properties:
          permissions:
            type: boolean
          dataScope:
            type: boolean
          menu:
            type: boolean
          dictionary:
            type: boolean
          operationLog:
            type: boolean
      frontend:
        description: 模块级前端元数据（可选；字段级元数据在 entity.fields[].frontend）。
        type: object
        additionalProperties: false
        properties:
          label:
            type: string
          route:
            type: string
          menuIcon:
            type: string

  # 明确禁止的敏感/运行时内容 (V0.7 第 17 节)
  secrets: false
  runtimeValues: false
  businessData: false
