# resolution-report.schema.yaml — ResolutionReport Contract Schema V1
# 依据: Engineering Platform 设计决策记录 V0.7 §18（ResolutionReport [DECIDED]）
# 定位: 解释解析过程（HOW / WHY），不是最终事实（WHAT）。
#       与 EffectiveProjectModel 的区别：
#       EPM = 最终事实快照；ResolutionReport = 解析过程审计记录。
# 本 Schema 只定义契约（语言无关），不定义 Resolver 如何计算。
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://engineering-platform.dev/schemas/resolution-report.schema.v1.yaml
title: Engineering Platform ResolutionReport
description: Resolver process audit record (HOW/WHY), companion of EffectiveProjectModel (V1)

type: object
additionalProperties: false
required:
  - schemaVersion
  - resolutionId
  - defaultsApplied
  - dependenciesAdded
  - providersSelected
  - overrides
  - constraints
  - warnings
  - compatibility
  - securityFindings
  - qualityEscalations
  - deprecatedExperimentalAssets

properties:
  schemaVersion:
    description: Contract schema version. Bump requires a documented migration.
    const: 1

  resolutionId:
    type: string
    description: 引用本次 Resolve 的 EffectiveProjectModel 快照标识（不复制 EPM 内容）。

  defaultsApplied:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/appliedDefault'

  dependenciesAdded:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/dependencyAdded'

  providersSelected:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/providerSelected'

  overrides:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/override'

  constraints:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/constraint'

  warnings:
    type: array
    uniqueItems: true
    items:
      type: string

  compatibility:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/compatibilityFinding'

  securityFindings:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/securityFinding'

  qualityEscalations:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/qualityEscalation'

  deprecatedExperimentalAssets:
    type: array
    uniqueItems: true
    items:
      type: string

  suggestions:
    description: |
      可选的建议列表（V0.7 §18 提及 Suggested Patch，但 004A 不定义正式 Patch Contract）。
      仅预留最小描述结构；不得设计 Patch DSL。
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/suggestion'

$defs:
  appliedDefault:
    type: object
    additionalProperties: false
    required: [key, value, source]
    properties:
      key:
        type: string
      value:
        type: [string, number, boolean, array, object]
      source:
        type: string
        enum: [platform-default, profile-default]

  dependencyAdded:
    type: object
    additionalProperties: false
    required: [dependencyId, reason]
    properties:
      dependencyId:
        type: string
      reason:
        type: string
      requiredBy:
        type: array
        uniqueItems: true
        items:
          type: string

  providerSelected:
    type: object
    additionalProperties: false
    required: [providerId, capability]
    properties:
      providerId:
        type: string
      capability:
        type: string
      reason:
        type: string

  override:
    type: object
    additionalProperties: false
    required: [key, from, to, source]
    properties:
      key:
        type: string
      from:
        type: [string, number, boolean, array, object]
      to:
        type: [string, number, boolean, array, object]
      source:
        type: string
        enum: [project, customer-constraint, platform-guardrail]

  constraint:
    type: object
    additionalProperties: false
    required: [name, value]
    properties:
      name:
        type: string
      value:
        type: [string, number, boolean]
      reason:
        type: string

  compatibilityFinding:
    type: object
    additionalProperties: false
    required: [subject, target, compatible]
    properties:
      subject:
        type: string
      target:
        type: string
      compatible:
        type: boolean
      detail:
        type: string

  securityFinding:
    type: object
    additionalProperties: false
    required: [code, severity]
    properties:
      code:
        type: string
      severity:
        type: string
        enum: [INFO, WARNING, ERROR, CRITICAL]
      detail:
        type: string

  qualityEscalation:
    type: object
    additionalProperties: false
    required: [from, to]
    properties:
      from:
        type: string
        pattern: ^Q[1-3]$
      to:
        type: string
        pattern: ^Q[1-3]$
      reason:
        type: string

  suggestion:
    description: 最小建议结构，仅表达意图，不构成可执行 Patch Contract。
    type: object
    additionalProperties: false
    required: [type, target, reason]
    properties:
      type:
        type: string
      target:
        type: string
      reason:
        type: string
