# generation-plan.schema.yaml — Generation Plan Contract Schema V1
# 依据: Engineering Platform 设计决策记录 V0.7 §20（Generation Plan V1 [DECIDED]）
#       与 §13（Generator Ownership Contract [DECIDED]）、§21（Executor/Rollback Standard V1 [DECIDED]）
# 定位: Generator 不直接写 Workspace；必须先由 EffectiveProjectModel + Work Item Scope
#       转换为版本化 GenerationPlan。Plan 是声明式计划，创建 Plan 时不得修改项目文件
#       （PLAN BEFORE WRITE）。
# 本 Schema 只定义契约（语言无关），不定义 Planner 如何计算。
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://engineering-platform.dev/schemas/generation-plan.schema.v1.yaml
title: Engineering Platform Generation Plan
description: Declarative generation plan (V1)

type: object
additionalProperties: false
required:
  - schemaVersion
  - planId
  - type
  - generatorVersion
  - source
  - operations
  - summary

properties:
  schemaVersion:
    description: Contract schema version. Bump requires a documented migration.
    const: 1

  planId:
    description: 版本化 GenerationPlan 的稳定标识（deterministic identity，绑定 generatorVersion + source）。
    type: string
    minLength: 1
    pattern: ^gp-[0-9a-f]{12}$

  type:
    description: 生成类型（V0.7 §20：V1 聚焦 Project/Module Scaffold、CRUD Resource、Domain Skeleton、Frontend Page、Test Skeleton）。
    type: string
    enum:
      - SCAFFOLD
      - MODULE
      - CRUD_RESOURCE
      - DOMAIN_SKELETON
      - FRONTEND_PAGE
      - TEST_SKELETON

  generatorVersion:
    description: 生成器版本（与 Resolver resolverVersion 独立）。
    type: string
    minLength: 1

  source:
    description: Resolver Snapshot 来源（resolutionId + inputHash），使 Plan 可追溯到一次 Resolve。
    type: object
    additionalProperties: false
    required:
      - resolutionId
      - inputHash
    properties:
      resolutionId:
        type: string
        minLength: 1
      inputHash:
        type: string
        minLength: 1

  scope:
    description: Plan 覆盖范围（自由描述，不得作为执行语义）。
    type: string

  operations:
    description: 标准 Operation 列表（V0.7 §20）。每个 Operation 明确 Ownership、Template Source、Preconditions 与 Dependency DAG。
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/operation"

  dependencies:
    description: Operation 级依赖 DAG（operationId 对）。同一 Operation 的 dependencies 字段是轻量替代。
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - from
        - to
      properties:
        from:
          type: string
        to:
          type: string

  validation:
    description: Plan 自身的验证记录（可选；执行时仍会独立验证）。
    type: object
    additionalProperties: true

  risks:
    description: 风险摘要（例如 DELETE 高风险、USER_OWNED 触碰等）。
    type: array
    items:
      type: string

  warnings:
    description: Plan 级警告。
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
        operationId:
          type: string

  summary:
    description: create/modify/delete/skip/ownership 摘要（供 Dry Run/Preview）。
    type: object
    additionalProperties: false
    required:
      - create
      - modify
      - delete
    properties:
      create:
        type: integer
        minimum: 0
      modify:
        type: integer
        minimum: 0
      delete:
        type: integer
        minimum: 0
      skip:
        type: integer
        minimum: 0
      ownerships:
        type: object
        additionalProperties:
          type: integer
          minimum: 0

$defs:
  operation:
    type: object
    additionalProperties: false
    required:
      - operationId
      - type
      - targetPath
      - ownership
      - overwritePolicy
      - reason
    properties:
      operationId:
        type: string
        minLength: 1

      type:
        description: Operation 类型（V0.7 §20 标准 Operation 子集；Executor V1 实现 CREATE_DIRECTORY/CREATE_FILE/UPDATE_MANAGED_FILE/DELETE）。
        type: string
        enum:
          - CREATE_DIRECTORY
          - CREATE_FILE
          - UPDATE_MANAGED_FILE
          - DELETE
          - REGISTER_MODULE
          - REGISTER_PROVIDER
          - ADD_MAVEN_MODULE
          - ADD_DEPENDENCY
          - ADD_FRONTEND_PACKAGE
          - ADD_ROUTE
          - ADD_PERMISSION
          - ADD_MIGRATION
          - ADD_TEST
          - ADD_GUIDE

      targetPath:
        description: Workspace root 内的相对路径（Path Safety 硬边界：拒绝 ../、绝对路径、symlink escape、保护路径）。
        type: string
        minLength: 1

      ownership:
        description: Ownership 四级（V0.7 §13 / AGENTS.md）。必须影响 CREATE/MODIFY/DELETE 是否允许。
        type: string
        enum:
          - GENERATED
          - MANAGED
          - USER_OWNED
          - IMMUTABLE

      overwritePolicy:
        description: 覆盖策略（由 Ownership 推导的决策；Executor 不得默认覆盖未知 Ownership 文件）。
        type: string
        enum:
          - ALLOWED
          - STRUCTURED_ONLY
          - FORBIDDEN

      templateSource:
        description: 模板来源（templateId@templateVersion 或 inline）；V1 支持最小 inline 内容或 artifact 引用。
        type: string

      content:
        description: 内联内容（仅用于小文件/测试 fixture；大文件应使用 contentRef，不要把完整大文件塞进 Plan）。
        type: string

      contentRef:
        description: 内容引用（staging artifact 路径或 hash 引用），避免在 Plan 内嵌大内容。
        type: object
        additionalProperties: false
        required:
          - ref
        properties:
          ref:
            type: string
          expectedHash:
            type: string

      reason:
        description: 该 Operation 的来源/理由（source）。
        type: string
        minLength: 1

      expectedBeforeHash:
        description: 最小 Precondition：Apply 前目标文件当前 hash 必须等于此值；不等 → CONFLICT → 不覆盖。
        type: string

      dependencies:
        description: 该 Operation 依赖的其他 operationId（DAG 边）。
        type: array
        items:
          type: string
