# provider.schema.yaml — Provider Contract Schema V1
# 依据: Engineering Platform 设计决策记录 V0.7 第 17 节
# 描述: Provider 契约，承载 Provider Identity / Implemented Capability /
#       Compatibility / Dependencies / Configuration Schema /
#       Feature·Mode / Security / Health·Criticality / Observability /
#       Testing / Migration·Replacement Risk / Guides / Governance Metadata。
# 约束: 仅声明式 Contract/Metadata；禁止 Secret / 客户 Runtime Values /
#       业务数据 / 任意可执行代码。
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://engineering-platform.dev/schemas/provider.schema.v1.yaml
title: Engineering Platform Provider Contract
description: Provider contract (V1)

type: object
additionalProperties: false
required:
  - schemaVersion
  - provider
  - implements
  - compatibility

properties:
  schemaVersion:
    description: Manifest schema version. Bump requires a documented migration.
    const: 1

  provider:
    type: object
    additionalProperties: false
    required: [id, name, version]
    properties:
      id:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      name:
        type: string
        minLength: 1
        maxLength: 200
      version:
        type: string
        pattern: ^\d+\.\d+\.\d+$
      description:
        type: string
        maxLength: 2000

  implements:
    description: Capability slot(s) this provider implements.
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^[a-z0-9]+(\.[a-z0-9]+)*$

  compatibility:
    type: object
    additionalProperties: false
    required: [platformVersion]
    properties:
      platformVersion:
        type: string
        maxLength: 50
      providerSchema:
        type: integer
      requires:
        type: array
        uniqueItems: true
        items:
          type: string

  dependencies:
    type: object
    additionalProperties: false
    properties:
      requiredCapabilities:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9]+(\.[a-z0-9]+)*$
      optionalCapabilities:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9]+(\.[a-z0-9]+)*$
      libraries:
        type: array
        uniqueItems: true
        items:
          type: string

  configurationSchema:
    type: object
    description: Declarative configuration schema (property -> type/default/required).
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [string, number, boolean, array, object, secret-ref]
        default:
          type: [string, number, boolean, array, object]
        required:
          type: boolean
        description:
          type: string

  features:
    type: array
    uniqueItems: true
    items:
      type: string

  modes:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        default:
          type: boolean
        description:
          type: string

  security:
    type: object
    additionalProperties: false
    properties:
      authentication:
        type: boolean
      authorization:
        type: boolean
      encryption:
        type: boolean
      audit:
        type: boolean
      notes:
        type: string

  health:
    type: object
    additionalProperties: false
    properties:
      criticality:
        type: string
        enum: [low, medium, high]
      checkEndpoint:
        type: string

  observability:
    type: object
    additionalProperties: false
    properties:
      metrics:
        type: boolean
      tracing:
        type: boolean
      logging:
        type: boolean

  testing:
    type: object
    additionalProperties: false
    properties:
      unit:
        type: boolean
      integration:
        type: boolean
      contract:
        type: boolean
      qualityMinimum:
        type: string
        pattern: ^Q[1-3]$

  migrationRisk:
    type: object
    additionalProperties: false
    properties:
      level:
        type: string
        enum: [low, medium, high]
      replacement:
        type: string
      notes:
        type: string

  guides:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [topic]
      properties:
        topic:
          type: string
        path:
          type: string

  governance:
    type: object
    additionalProperties: false
    properties:
      ownerTeam:
        type: string
      reviewRequired:
        type: boolean
      status:
        type: string
        enum: [experimental, supported, deprecated]

  metadata:
    type: object
    additionalProperties: true
    properties:
      tags:
        type: array
        items:
          type: string

  # 明确禁止的敏感/运行时内容 (V0.7 第 17 节)
  secrets: false
  runtimeValues: false
  businessData: false
