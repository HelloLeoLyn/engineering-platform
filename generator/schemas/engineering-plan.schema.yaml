# engineering-plan.schema.yaml — Engineering Plan Contract Schema V1
# 依据: V0.7 §14（AI Engineering Contract [DECIDED]）/ §22（AI Engineering Artifact Schema V1 [DECIDED]）
# 定位: EngineeringPlan = WorkItem → Implementation strategy（怎么完成工程任务）。
#       与 GenerationPlan（具体文件变更计划）区分。
# 本 Schema 只定义契约，不定义 Planner 如何计算。
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://engineering-platform.dev/schemas/engineering-plan.schema.v1.yaml
title: Engineering Platform Engineering Plan
description: Implementation strategy for a WorkItem (V1)

type: object
additionalProperties: false
required:
  - schemaVersion
  - planId
  - workItemId
  - steps
  - testStrategy

properties:
  schemaVersion:
    description: Contract schema version. Bump requires a documented migration.
    const: 1

  planId:
    type: string
    minLength: 1

  workItemId:
    description: Provenance：绑定 WorkItem。
    type: string
    minLength: 1

  steps:
    description: 实施步骤（结构化 + 依赖 DAG）。
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/step"

  dependencies:
    description: 依赖的 Artifact/Plan 引用（Provenance Graph）。
    type: array
    items:
      type: string

  expectedChanges:
    description: 预期变更摘要（结构化引用：generation-plan / change-manifest id 或路径范围）。
    type: array
    items:
      type: string

  testStrategy:
    description: 测试策略（引用 TestPlan 或描述；结构化在 TestPlan Contract）。
    type: string

  risks:
    type: array
    items:
      type: string

  rollbackConsideration:
    description: 回滚考虑（引用 005+006 Rollback 语义或描述）。
    type: string

$defs:
  step:
    type: object
    additionalProperties: false
    required:
      - stepId
      - objective
    properties:
      stepId:
        type: string
        minLength: 1
      objective:
        type: string
      dependencies:
        type: array
        items:
          type: string
      expectedArtifacts:
        type: array
        items:
          type: string
