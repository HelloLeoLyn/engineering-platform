# implementation-tasks.schema.yaml — Implementation Tasks Contract Schema V1
# 依据: V0.7 §14 / §22（ImplementationTasks 是核心 Artifact）
# 定位: 将 EngineeringPlan 拆成可执行 Task；支持 dependency DAG；
#       Task Executor 可报告 DONE/FAILED/BLOCKED + Evidence，但不得直接设置 WorkItem=ACCEPTED。
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://engineering-platform.dev/schemas/implementation-tasks.schema.v1.yaml
title: Engineering Platform Implementation Tasks
description: Executable task breakdown of an EngineeringPlan (V1)

type: object
additionalProperties: false
required:
  - schemaVersion
  - workItemId
  - planId
  - tasks

properties:
  schemaVersion:
    description: Contract schema version. Bump requires a documented migration.
    const: 1

  workItemId:
    type: string
    minLength: 1

  planId:
    type: string
    minLength: 1

  tasks:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/task"

$defs:
  task:
    type: object
    additionalProperties: false
    required:
      - taskId
      - workItemId
      - planId
      - objective
      - status
    properties:
      taskId:
        type: string
        minLength: 1
      workItemId:
        type: string
        minLength: 1
      planId:
        type: string
        minLength: 1
      objective:
        type: string
      status:
        description: Task 执行状态（Task 层状态；与 WorkItem 状态机分离）。
        type: string
        enum:
          - PLANNED
          - IN_PROGRESS
          - DONE
          - FAILED
          - BLOCKED
      scope:
        description: Task 级 scope（可选；结构同 WorkItem scope 简化）。
        type: object
        additionalProperties: true
      dependencies:
        description: 依赖的其他 taskId（DAG；检测 unknown dependency + cycle）。
        type: array
        items:
          type: string
      expectedArtifacts:
        type: array
        items:
          type: string
      acceptanceCriteria:
        description: 引用的 WorkItem acceptance criterionId 列表。
        type: array
        items:
          type: string
      evidence:
        description: Task 提供的 Evidence 引用（不塞内容）。
        type: array
        items:
          type: string
