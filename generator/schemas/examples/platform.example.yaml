# 示例：Platform Root Manifest（合法示例）
# 对应 schema: generator/schemas/platform.schema.yaml
schemaVersion: 1

platform:
  id: demo-platform
  name: Demo Platform
  version: 0.1.0
  status: active
  maturity: experimental
  description: 用于演示与校验的示例平台

technology:
  bom:
    id: demo-platform-bom
    version: 0.1.0

profiles:
  presets:
    lite:
      application: lite
      infrastructure: lite
      security: standard
      quality: Q1
    standard:
      application: standard
      infrastructure: standard
      security: standard
      quality: Q2
  default: lite

capabilities:
  persistence: { id: persistence, provider: mybatis-plus }
  print: { id: print }

providers:
  mybatis-plus: { id: mybatis-plus, version: 3.5.17 }

modules:
  sample-customer: { id: sample-customer, version: 0.1.0 }

quality:
  profiles:
    Q1:
      required: [build, unit, architecture, smoke]
    Q2:
      extends: Q1
      required: [integration, api, migration, browser-e2e]
    Q3:
      extends: Q2
      required: [concurrency, idempotency, failure-recovery, security]
  default: Q2

generator:
  version: 0.1.0
  schemas:
    platform: generator/schemas/platform.schema.yaml
    project: generator/schemas/project.schema.yaml
    module: generator/schemas/module.schema.yaml
    provider: generator/schemas/provider.schema.yaml

registries:
  capability: { path: registry/capabilities.yaml }
  provider: { path: registry/providers.yaml }
  module: { path: registry/modules.yaml }
  event: { path: registry/events.yaml }
  task: { path: registry/tasks.yaml }
  permission: { path: registry/permissions.yaml }
  error: { path: registry/errors.yaml }
  guide: { path: registry/guides.yaml }

compatibility:
  projectSchema: { supported: [1] }
  moduleSchema: { supported: [1] }
  providerSchema: { supported: [1] }

governance:
  ownership: { required: true }
  architectureValidation: { required: true }
  securityGate: { required: true }
  guides: { requiredForStableAssets: true }

guides:
  architecture: { path: docs/architecture }
  standards: { path: docs/standards }
  ai: { path: docs/ai }

metadata:
  ownerTeam: demo-team
  tags: [demo, validation]
