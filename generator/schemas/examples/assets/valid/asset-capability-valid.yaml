schemaVersion: 1
id: persistence
type: CAPABILITY
version: 0.1.0
description: Project capability contract for relational persistence (schema, mapper, transaction baseline).
dependencies:
  - type: PROVIDER
    id: mybatis-plus
    version: 3.x
    required: true
compatibility:
  java: "25"
  springBoot: "3.x"
  compatibleProviders: [mybatis-plus]
configuration:
  - key: spring.datasource.url
    type: secretRef
    required: true
    description: JDBC URL reference (secret/config store).
  - key: spring.datasource.username
    type: configRef
    required: true
    description: DB username reference.
conformance:
  requiredConfig:
    - spring.datasource.url
    - spring.datasource.username
metadata:
  author: engineering-platform
  maturity: stable
  tags: [capability, persistence]
