schemaVersion: 1
id: mybatis-plus
type: PROVIDER
version: 3.5.17
description: MyBatis-Plus provider implementing the persistence capability (Java 25 / Spring Boot 3 baseline).
dependencies:
  - type: CAPABILITY
    id: persistence
    version: 1.x
    required: true
compatibility:
  java: "25"
  springBoot: "3.x"
  requiredCapabilities: [persistence]
files:
  - source: templates/persistence/mybatis-config.yaml.ftl
    target: src/main/resources/mybatis-config.yaml
    ownership: GENERATED
    mode: render
  - source: templates/persistence/MapperScan.java.ftl
    target: src/main/java/{package}/infrastructure/persistence/MapperScan.java
    ownership: GENERATED
    mode: render
configuration:
  - key: mybatis-plus.mapper-locations
    type: string
    required: false
    default: classpath*:mapper/**/*.xml
    description: Mapper XML locations.
conformance:
  requiredFiles:
    - src/main/java/{package}/infrastructure/persistence/MapperScan.java
  requiredDependencies:
    - com.baomidou:mybatis-plus-spring-boot3-starter
  forbiddenDependencies:
    - org.apache.log4j:log4j
metadata:
  author: engineering-platform
  maturity: experimental
  tags: [provider, mybatis-plus, persistence]
