schemaVersion: 1

platform:
  id: engineering-platform
  name: Engineering Platform
  version: 0.1.0
  status: active
  maturity: experimental

technology:
  bom:
    id: platform-bom
    version: 0.1.0
  # V0.2 Reference Stack single source of truth (V02-WORK-006 §7):
  # surfaced via EPM.technology and enforced by Engineering Conformance.
  java: "25"
  springBoot: "3.x"
  # V06-WORK-001: Certified Stack Profile（技术栈由 Profile 管理，不散落 Generator if/else）
  stackProfiles:
    enterprise-java25:
      status: certified
      description: Enterprise Java 25 reference stack (V0.6 certified)
      backend:
        java: "25"
        springBoot: "3.x"
        build: maven
        persistence: mybatis-plus
        migration: flyway
        database: mysql
        api: rest
        validation: jakarta-validation
      frontend:
        framework: vue3
        language: typescript
        build: vite
        state: pinia
        ui: element-plus
        uiSystem: ep-ui
      testing:
        unit: junit
        frontendUnit: vitest
        browserE2E: playwright-golden-path

profiles:
  presets:
    lite:
      application: lite
      infrastructure: lite
      security: standard
      quality: Q1
    standard:
      application: standard
      infrastructure: standard
      security: standard
      quality: Q2

capabilities: {}
providers: {}
modules: {}

quality:
  profiles:
    Q1:
      required: [build, unit, architecture, smoke]
    Q2:
      extends: Q1
      required: [integration, api, migration, browser-e2e]
    Q3:
      extends: Q2
      required: [concurrency, idempotency, failure-recovery, security, upgrade-compatibility]

generator:
  version: 0.1.0
  schemas:
    platform: generator/schemas/platform.schema.yaml
    project: generator/schemas/project.schema.yaml
    module: generator/schemas/module.schema.yaml
    provider: generator/schemas/provider.schema.yaml
    effectiveProject: generator/schemas/effective-project.schema.yaml

registries:
  capability: { path: registry/capabilities.yaml }
  provider: { path: registry/providers.yaml }
  module: { path: registry/modules.yaml }
  event: { path: registry/events.yaml }
  task: { path: registry/tasks.yaml }
  permission: { path: registry/permissions.yaml }
  error: { path: registry/errors.yaml }
  guide: { path: registry/guides.yaml }

compatibility:
  projectSchema: { supported: [1] }
  moduleSchema: { supported: [1] }
  providerSchema: { supported: [1] }

governance:
  ownership: { required: true }
  architectureValidation: { required: true }
  securityGate: { required: true }
  guides: { requiredForStableAssets: true }

guides:
  architecture: { path: docs/architecture }
  standards: { path: docs/standards }
  ai: { path: docs/ai }

# V06-WORK-001: Application Profiles（与 Frontend Template 解耦；V0.6 仅 enterprise certified）
applicationProfiles:
  enterprise:
    status: certified
    description: Enterprise admin application (V0.6 certified)
  corporate-portal:
    status: reserved
    description: Corporate portal (reserved, not implemented in V0.6)
  ecommerce:
    status: reserved
    description: Independent e-commerce (reserved, not implemented in V0.6)
  custom:
    status: reserved
    description: Custom application profile (reserved)

# V06-WORK-001: Frontend Templates（V0.6 仅 enterprise-admin certified，其余预留 unsupported）
frontendTemplates:
  enterprise-admin:
    status: certified
    description: Enterprise admin template (V0.6 certified)
    assets: [frontend-shell, frontend-auth, frontend-permission, frontend-enterprise-management]
  modern-console:
    status: reserved
    description: Modern console template (reserved, not implemented in V0.6)
  simple-admin:
    status: reserved
    description: Simple admin template (reserved, not implemented in V0.6)
  corporate-website:
    status: reserved
    description: Corporate website template (reserved, not implemented in V0.6)
  commerce-storefront:
    status: reserved
    description: Commerce storefront template (reserved, not implemented in V0.6)
  custom:
    status: reserved
    description: Custom frontend template (reserved)

metadata:
  ownerTeam: platform-team
  tags: [engineering-platform, modular, ai-assisted-development]
