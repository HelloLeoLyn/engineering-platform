    ownership: GENERATED
    mode: render
  - source: templates/OperationLogPort.java.ftl
    target: src/main/java/{package}/application/operationlog/OperationLogPort.java
    ownership: GENERATED
    mode: render
  - source: templates/MybatisOperationLogRepository.java.ftl
