conformance:
  requiredFiles:
    - src/main/java/{package}/common/security/OperationLog.java
    - src/main/java/{package}/common/security/OperationResult.java
    - src/main/java/{package}/domain/entity/SysOperationLog.java
    - src/main/java/{package}/infrastructure/persistence/mapper/SysOperationLogMapper.java
