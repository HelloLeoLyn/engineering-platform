schemaVersion: 1
id: operation-log
type: CAPABILITY
version: 0.1.0
description: 操作日志企业能力（@OperationLog 注解 + 真实切面 enforcement + SUCCESS/FAILURE + sys_operation_log 落库 + 敏感数据安全硬 Gate），消费 platform-core + rbac + persistence。
dependencies:
  - type: CAPABILITY
    id: platform-core
    version: 1.x
    required: true
  - type: CAPABILITY
    id: rbac
    version: 1.x
    required: true
  - type: CAPABILITY
    id: persistence
    version: 1.x
    required: true
compatibility:
  java: "25"
  springBoot: "3.x"
  requiredCapabilities: [platform-core, rbac, persistence]
files:
