    - src/main/java/{package}/api/operationlog/OperationLogReferenceController.java
    - src/main/resources/db/migration/V007__operation_log.sql
    - src/test/java/{package}/OperationLogModelUnitTest.java
    - src/test/java/{package}/OperationLogE2ETest.java
  requiredDependencies:
    - org.springframework.boot:spring-boot-starter-aop
    - com.h2database:h2
  requiredConfig:
