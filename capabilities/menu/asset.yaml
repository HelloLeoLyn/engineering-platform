schemaVersion: 1
id: menu
type: CAPABILITY
version: 0.1.0
description: 菜单企业能力（后端权限资源模型 DIRECTORY/MENU/ACTION + permissionCode 引用 RBAC + GET /api/menus/me 权限过滤 + 树安全校验），消费 platform-core + rbac + persistence。
dependencies:
  - type: CAPABILITY
    id: platform-core
    version: 1.x
    required: true
  - type: CAPABILITY
    id: rbac
    version: 1.x
    required: true
  - type: CAPABILITY
    id: persistence
    version: 1.x
    required: true
compatibility:
  java: "25"
  springBoot: "3.x"
  requiredCapabilities: [platform-core, rbac, persistence]
