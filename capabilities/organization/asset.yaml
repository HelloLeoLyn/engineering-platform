schemaVersion: 1
id: organization
type: CAPABILITY
version: 0.1.0
description: 组织/部门基础能力（Department 树 + 用户部门关联），消费 platform-core + rbac + persistence。
dependencies:
  - type: CAPABILITY
    id: platform-core
    version: 1.x
    required: true
  - type: CAPABILITY
    id: rbac
    version: 1.x
    required: true
  - type: CAPABILITY
    id: persistence
    version: 1.x
    required: true
compatibility:
  java: "25"
  springBoot: "3.x"
  requiredCapabilities: [platform-core, rbac, persistence]
files:
  - source: templates/SysDepartment.java.ftl
    target: src/main/java/{package}/domain/entity/SysDepartment.java
    ownership: GENERATED
    mode: render
  - source: templates/SysDepartmentMapper.java.ftl
    target: src/main/java/{package}/infrastructure/persistence/mapper/SysDepartmentMapper.java
    ownership: GENERATED
    mode: render
  - source: templates/DepartmentPort.java.ftl
    target: src/main/java/{package}/application/organization/DepartmentPort.java
    ownership: GENERATED
    mode: render
  - source: templates/MybatisDepartmentRepository.java.ftl
    target: src/main/java/{package}/infrastructure/persistence/MybatisDepartmentRepository.java
    ownership: GENERATED
    mode: render
  - source: templates/DepartmentService.java.ftl
    target: src/main/java/{package}/application/organization/DepartmentService.java
    ownership: GENERATED
    mode: render
  - source: templates/DepartmentController.java.ftl
    target: src/main/java/{package}/api/organization/DepartmentController.java
    ownership: GENERATED
    mode: render
  - source: templates/OrganizationBeansConfig.java.ftl
    target: src/main/java/{package}/infrastructure/persistence/OrganizationBeansConfig.java
    ownership: GENERATED
    mode: render
  - source: templates/V003__organization.sql.ftl
    target: src/main/resources/db/migration/V003__organization.sql
    ownership: GENERATED
    mode: render
conformance:
  requiredFiles:
    - src/main/java/{package}/domain/entity/SysDepartment.java
    - src/main/java/{package}/infrastructure/persistence/mapper/SysDepartmentMapper.java
    - src/main/java/{package}/application/organization/DepartmentPort.java
    - src/main/java/{package}/infrastructure/persistence/MybatisDepartmentRepository.java
    - src/main/java/{package}/application/organization/DepartmentService.java
    - src/main/java/{package}/api/organization/DepartmentController.java
    - src/main/java/{package}/infrastructure/persistence/OrganizationBeansConfig.java
    - src/main/resources/db/migration/V003__organization.sql
  requiredDependencies:
    - org.springframework.boot:spring-boot-starter-aop
  requiredConfig:
    - spring.datasource.url
  forbiddenImports:
    - cn.dev33.satoken
    - org.springframework.security.web
    - org.springframework.security.config
  forbiddenImportsExcludedPaths:
    - src/main/java/{package}/infrastructure/
documentation:
  guide: docs/README.md
