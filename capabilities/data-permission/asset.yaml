schemaVersion: 1
id: data-permission
type: CAPABILITY
version: 0.1.0
description: 数据权限 V1（DataScope ALL/DEPARTMENT/DEPARTMENT_AND_CHILDREN/SELF + 查询层真实 enforcement），消费 platform-core + organization + rbac + persistence。
dependencies:
  - type: CAPABILITY
    id: platform-core
    version: 1.x
    required: true
  - type: CAPABILITY
    id: organization
    version: 1.x
    required: true
  - type: CAPABILITY
    id: rbac
    version: 1.x
    required: true
  - type: CAPABILITY
    id: persistence
    version: 1.x
    required: true
compatibility:
