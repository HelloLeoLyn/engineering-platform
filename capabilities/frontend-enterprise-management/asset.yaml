schemaVersion: 1
id: frontend-enterprise-management
type: CAPABILITY
version: 0.1.0
description: 前端企业管理 UI（User/Role+Permission/Department/Menu/Dictionary/Operation Log 全量管理页面 + 可复用 UI 组件 AppTable/AppForm/SearchForm/StatusTag/ConfirmAction/FormDrawer/DepartmentTree/DictionarySelect + /system/* 受控路由）。统一遵守 frontend-ux-baseline，全部经 Platform Request Client，权限 UI 仅控制可见性（后端 RBAC 是最终边界）。V05-WORK-004。
dependencies:
  - type: CAPABILITY
    id: frontend-auth
    version: 1.x
    required: true
  - type: CAPABILITY
    id: frontend-permission
    version: 1.x
    required: true
  - type: CAPABILITY
    id: rbac
    version: 1.x
    required: true
  - type: CAPABILITY
    id: organization
    version: 1.x
    required: true
  - type: CAPABILITY
    id: menu
    version: 1.x
    required: true
  - type: CAPABILITY
    id: dictionary
    version: 1.x
    required: true
  - type: CAPABILITY
    id: operation-log
    version: 1.x
    required: true
compatibility:
  java: "25"
  springBoot: "3.x"
  requiredCapabilities: [frontend-auth, frontend-permission, rbac, organization, menu, dictionary, operation-log]
