schemaVersion: 1
id: dictionary
type: CAPABILITY
version: 0.1.0
description: 字典企业能力（DictionaryType + DictionaryItem + GET /api/dictionaries/{code}/items + disabled 过滤 + 稳定排序 + DTO 不暴露实体），消费 platform-core + persistence。
dependencies:
  - type: CAPABILITY
    id: platform-core
    version: 1.x
    required: true
  - type: CAPABILITY
    id: persistence
    version: 1.x
    required: true
compatibility:
  java: "25"
  springBoot: "3.x"
  requiredCapabilities: [platform-core, persistence]
