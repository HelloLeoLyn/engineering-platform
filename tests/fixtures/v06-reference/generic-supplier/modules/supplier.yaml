schemaVersion: 1
module:
  id: supplier
  name: Supplier
  version: 1.0.0
  type: business
  description: V06-WORK-002B supplier generic migration proof (Contract-only, no supplier-reference capability)
compatibility:
  platformVersion: "0.6"
business:
  table: supplier
  entity:
    name: Supplier
    fields:
      - name: code
        type: string
        required: true
        unique: true
        length: 50
      - name: name
        type: string
        required: true
        length: 100
      - name: status
        type: string
        semantic: dictionary
        dictionary: supplier_status
      - name: category
        type: string
        semantic: dictionary
        dictionary: supplier_category
  features: [list, search, create, edit, detail, disable]
  enterprise:
    permissions: true
    dataScope: true
    menu: true
    dictionary: true
    operationLog: true
