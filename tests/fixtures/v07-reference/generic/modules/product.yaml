schemaVersion: 1
module:
  id: product
  name: Product
  version: 1.0.0
  type: business
  description: V0.7 reference target (simple product module, no relations)
compatibility:
  platformVersion: "0.6"
business:
  table: product_catalog
  entity:
    name: Product
    fields:
      - name: code
        type: string
        required: true
        unique: true
        length: 50
      - name: name
        type: string
        required: true
        length: 100
      - name: unitPrice
        type: money
        precision: 12
        scale: 2
      - name: status
        type: string
        semantic: enum
        enum:
          values:
            - value: ACTIVE
              label: Active
            - value: INACTIVE
              label: Inactive
  features: [list, search, create, edit, detail, disable]
  enterprise:
    permissions: false
    dataScope: true
    menu: false
    dictionary: false
    operationLog: true
  frontend:
    route: /product
    label: Product
