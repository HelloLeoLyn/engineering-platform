schemaVersion: 1
id: mybatis-plus
type: PROVIDER
version: 3.5.17
description: MyBatis-Plus provider — persistence capability 的技术实现（Java 25 / Spring Boot 3 reference stack）。
dependencies:
  - type: CAPABILITY
    id: persistence
    version: 1.x
    required: true
compatibility:
  java: "25"
  springBoot: "3.x"
  requiredCapabilities: [persistence]
files:
  - source: templates/application-mybatis.yaml.ftl
    target: src/main/resources/application-mybatis.yaml
    ownership: GENERATED
    mode: render
  - source: templates/MapperScanConfig.java.ftl
    target: src/main/java/{package}/infrastructure/persistence/MapperScanConfig.java
    ownership: GENERATED
    mode: render
configuration:
  - key: mybatis-plus.mapper-locations
    type: string
    required: false
    default: classpath*:mapper/**/*.xml
    description: Mapper XML locations.
conformance:
  requiredFiles:
    - src/main/java/{package}/infrastructure/persistence/MapperScanConfig.java
  requiredDependencies:
    - com.baomidou:mybatis-plus-spring-boot3-starter
  forbiddenDependencies:
    - org.apache.log4j:log4j
tests:
  fixtures:
    - tests/fixtures/mybatis-plus-spring-boot3-starter.gav.yaml
documentation:
  guide: docs/README.md
