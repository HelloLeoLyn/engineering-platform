name: CI

on:
  push:
  pull_request:

jobs:
  contract-validation:
    name: Contract Validation (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install jsonschema pyyaml
      - name: Manifest Contract Validation
        run: python3 generator/scripts/validate-manifest.py --all
      - name: Registry Validation
        run: python3 generator/scripts/validate-registry.py --all
      - name: Resolver Contract Validation
        run: python3 generator/scripts/validate-resolver-contracts.py
      - name: Generator Contract Validation
        run: python3 generator/scripts/validate-generator-contracts.py
      - name: Engineering Work Contract Validation
        run: python3 generator/scripts/validate-engineering-work-contracts.py
      - name: Agent Execution Contract Validation
        run: python3 generator/scripts/validate-agent-execution-contracts.py
      - name: Asset Contract Validation
        run: python3 generator/scripts/validate-assets.py --all

  java-build:
    name: Java 25 Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Environment diagnostics
        run: |
          java -version
          mvn -version
          node --version
          df -h
          free -h
      - name: Maven compile + test (generator)
        run: mvn -f generator/pom.xml test

  enterprise-generation-e2e:
    name: Enterprise Generation E2E (fresh generate + generated build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Environment diagnostics
        run: |
          java -version
          mvn -version
          node --version
          df -h
          free -h
      - name: Compile generator (CLI dependency)
        run: mvn -B -f generator/pom.xml compile -pl generator-core -am
      - name: ep validate (single-declaration product-reference manifest)
        run: |
          mkdir -p /tmp/v04-e2e
          cat > /tmp/v04-e2e/project.yaml << 'EOF'
          schemaVersion: 1
          project:
            id: core-demo
            name: Core Demo Service
            version: 1.0.0
            basePackage: com.acme.core
            groupId: com.acme
            artifactId: core-demo
          platform:
            id: engineering-platform
          capabilities:
            - id: product-reference
          quality:
            minimum: Q2
          EOF
          ./ep validate /tmp/v04-e2e/project.yaml
      - name: ep generate + conformance
        run: |
          ./ep generate /tmp/v04-e2e/project.yaml --output /tmp/v04-e2e/gen
          ./ep conformance /tmp/v04-e2e/project.yaml /tmp/v04-e2e/gen
      - name: Generated project mvn test (real enterprise E2E)
        run: mvn -B -f /tmp/v04-e2e/gen/pom.xml test
