spring:
  application:
    name: engineering-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/engineering_platform}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/sample-customer

management:
  endpoints:
    web:
      exposure:
        include: [health, info]

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
